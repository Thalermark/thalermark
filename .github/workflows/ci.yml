name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      # Cache the Postgres image used by testcontainers (~700MB).
      # Update the cache key if the image tag changes in
      # packages/db/tests/global-setup.ts.
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-pgvector-pg17

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint DB migrations (squawk)
        run: pnpm db:lint

      - name: Typecheck
        run: pnpm typecheck

      # Web and installed phone apps read the api contract, and no route is
      # version-prefixed, so a newer api has to keep serving older clients.
      # --frozen verifies the committed snapshot matches what the code produces;
      # it never rewrites it here.
      - name: Check the API contract
        run: pnpm contract:check --frozen

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The layer nothing above can see (TMC-249). Everything before this runs
      # below the browser, which is how four consecutive commits once passed the
      # whole suite while the bug was still on the screen.
      #
      # Needs a real stack: postgres, migrations, the api, and the web server
      # (Playwright starts the last one itself). The api is started with
      # REQUIRE_EMAIL_VERIFICATION=false so the setup project can sign up and
      # reach an in-app page without a mailbox.
      - name: Install Chromium for Playwright
        run: pnpm --filter @thalermark/web test:browser:install

      # --wait, not a bare `up -d`. Compose returns as soon as the container is
      # STARTED, which is several seconds before Postgres accepts connections —
      # and drizzle-kit's spinner swallows the connection error, so the failure
      # reads as "applying migrations... exit 1" with no cause. The service
      # already declares a healthcheck; --wait is what honours it.
      - name: Start Postgres
        run: docker compose -f docker/docker-compose.dev.yml up -d --wait postgres

      - name: Migrate
        run: pnpm drizzle:migrate
        env:
          DATABASE_URL: postgres://thalermark:thalermark@localhost:5432/thalermark

      - name: Start the API
        run: |
          pnpm --filter @thalermark/api dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/health || { echo '--- api failed to start ---'; cat /tmp/api.log; exit 1; }
        env:
          DATABASE_URL: postgres://thalermark:thalermark@localhost:5432/thalermark
          APP_DATABASE_URL: postgres://thalermark:thalermark@localhost:5432/thalermark
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          PUBLIC_APP_URL: http://localhost:5173
          TRUSTED_ORIGINS: http://localhost:5173,http://localhost:4173
          REQUIRE_EMAIL_VERIFICATION: 'false'
          MIGRATE_ON_BOOT: 'false'
          JOBS_ENABLED: 'false'
          NODE_ENV: development

      - name: Browser tests
        run: pnpm --filter @thalermark/web test:browser
        env:
          CI: 'true'
          PLAYWRIGHT_API_URL: http://localhost:3000
          PLAYWRIGHT_ORIGIN: http://localhost:5173
          INTERNAL_API_URL: http://localhost:3000
          PUBLIC_API_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
