name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6

      # Cache the Postgres image used by testcontainers (~700MB).
      # Update the cache key if the image tag changes in
      # packages/db/tests/global-setup.ts.
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-pgvector-pg17

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint DB migrations (squawk)
        run: pnpm db:lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker-compose.yml references env_file: ../.env. The file doesn't need
      # real values for a build-only check (env_file is consumed at runtime),
      # but compose validates the path exists when building.
      - name: Stage .env for compose path-validation
        run: cp .env.example .env

      - name: Build api + web images
        run: docker compose -f docker/docker-compose.yml build api web
