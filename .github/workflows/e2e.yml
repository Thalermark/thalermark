name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The end-to-end walkthrough, against a real HTTP surface (TMC-188).
#
# Distinct from the `test` job in ci.yml, and deliberately so. The integration
# suite builds the app in-process and talks to Postgres as the container
# SUPERUSER, which bypasses row-level security entirely. These suites sign up
# over HTTP, carry a real session, and reach the database through the
# non-BYPASSRLS `thalermark_app` role — so RLS is actually enforced here in a
# way the integration suite cannot check.
#
# Scope: suites 01-06 and 09. The web-driving suites need the SvelteKit app
# served on TMC_WEB, which this job now does — `pnpm build` was already
# building apps/web, so it only had to be started.
#
# 07 and 08 also drive the web app and are still excluded, deliberately. They
# have never run in CI and were written against a dev machine, so switching
# them on in the same change would mix "the launch-gate regressed" with "suite
# 08 was always a bit red" in the same signal. Their own ticket.
#
# 09 covers the public invoice → pay path with NO session (TMC-209/210/211).
# It is the only suite here that asserts what a stranger sees, which is the
# gap that let a guard bug reach an audit: every other helper we own stamps a
# cookie on every request, and a signed-in session hid the bug completely.
#
# No Stripe keys in this job, on purpose — real card calls in CI are flaky and
# a flaky suite gets ignored. 09 detects that and skips the two assertions
# that need a payable invoice; the amount arithmetic is pinned by the api
# integration tests instead. The TMC-209 guard assertion, which is the P0,
# needs no Stripe and always runs.

jobs:
  e2e:
    name: end-to-end walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thalermark
        ports:
          - 5432:5432
        # Without a healthcheck the job races the container and the first
        # connection fails on a cold start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      # Superuser handle: migrations, role provisioning, and the harness's
      # direct SQL assertions.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thalermark
      # The app's own non-BYPASSRLS role. runBootMigrations provisions it from
      # THALERMARK_APP_PASSWORD below, so the two must agree. The name is not
      # APP_ROLE_PASSWORD — that reads as unset, provisioning is silently
      # skipped, and the app pool then fails to authenticate.
      APP_DATABASE_URL: postgres://thalermark_app:e2e_app_password@localhost:5432/thalermark
      THALERMARK_APP_PASSWORD: e2e_app_password
      MIGRATE_ON_BOOT: 'true'
      BETTER_AUTH_SECRET: e2e-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:5173
      API_PORT: '3000'
      # Server-side fetches from the SvelteKit app to the api. hooks.server.ts
      # prefers INTERNAL_API_URL over PUBLIC_API_URL; both default to this same
      # value, but relying on a default is how the next port change breaks the
      # job silently.
      INTERNAL_API_URL: http://localhost:3000
      # The harness signs up a fresh account per suite and hammers the API far
      # harder than a human would; the limiter would throttle it into false
      # failures. It is exercised by app-rate-limit.integration.test.ts instead.
      RATE_LIMIT_ENABLED: 'false'
      # No pg-boss in this job — the sweeps have their own coverage and a
      # background worker only adds nondeterminism to the assertions.
      JOBS_ENABLED: 'false'
      LOG_LEVEL: warning

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness asserts directly against the database, so it needs a client.
      # ubuntu-latest ships one today, but relying on that makes the job depend
      # on a runner-image detail that can change under us.
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build
        run: pnpm build

      # Backgrounded, with output kept so a boot failure is diagnosable rather
      # than just a timed-out wait.
      - name: Start the API
        run: |
          pnpm --filter @thalermark/api start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready — boot log follows:"
          cat /tmp/api.log
          exit 1

      # adapter-node, so this is the same built artifact the self-host image
      # serves — `pnpm build` above already produced apps/web/build. PORT is set
      # here rather than at job level so it cannot be mistaken for the api's
      # (which reads API_PORT). ORIGIN is what adapter-node checks on form
      # POSTs; suite 09 is GET-only, but 07/08 are not and this is the value
      # they will need.
      - name: Start the web app
        env:
          PORT: '5173'
          ORIGIN: http://localhost:5173
        run: |
          pnpm --filter @thalermark/web start > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      # /sign-in is public, cheap, and server-rendered, so a 200 here means the
      # app is genuinely serving pages rather than merely holding the port open.
      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/sign-in > /dev/null 2>&1; then
              echo "web ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "web app did not become ready — boot log follows:"
          cat /tmp/web.log
          exit 1

      # TMC_DATABASE_URL routes the harness's psql_q through the runner's psql
      # instead of `docker exec`; there is no container to exec into here.
      - name: Run the walkthrough (suites 01-06, 09)
        env:
          TMC_API: http://localhost:3000
          TMC_WEB: http://localhost:5173
          TMC_DATABASE_URL: postgres://postgres:postgres@localhost:5432/thalermark
        run: |
          set -euo pipefail
          failed=0
          for suite in e2e/0[1-6]-*.sh e2e/09-*.sh; do
            echo "::group::$suite"
            # Each suite reports its own pass/fail tally and exits non-zero on
            # any failure. Keep going rather than bailing on the first, so one
            # run surfaces every broken suite instead of only the earliest.
            if ! bash "$suite"; then
              failed=1
              echo "::error::$suite failed"
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

      # A web suite failing usually means an SSR error, and the assertion text
      # alone won't say which — the stack trace is only in this log.
      - name: Web log on failure
        if: failure()
        run: cat /tmp/web.log

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

      - name: Stop the web app
        if: always()
        run: kill "$(cat /tmp/web.pid)" 2>/dev/null || true
