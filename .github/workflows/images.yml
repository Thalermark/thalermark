name: Images

# Builds the api + web container images.
#   - pull_request (path-filtered): build only, NO push — catches a broken
#     Dockerfile (e.g. a new workspace package missing from its COPY list)
#     before merge, without building on docs/config-only PRs.
#   - push tag v* / manual dispatch: build AND push to GHCR for deploy.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '**/Dockerfile'
      - 'pnpm-lock.yaml'
      - 'docker/**'
      - '.github/workflows/images.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Registry creds are only needed when we actually push (tag / dispatch).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # GHCR paths must be lowercase; the org is "Thalermark".
          images: ghcr.io/thalermark/thalermark-${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # App version baked into the web build (Settings → About): the release
          # tag on a tag build, else the commit SHA. The api Dockerfile ignores
          # this arg, so it's harmless to pass to both matrix legs.
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # PR = validate only; tag/manual = publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DO/Hetzner droplets are x86; single-arch halves build time.
          platforms: linux/amd64
          # Distinct scope per image — a shared gha cache namespace would let
          # the api and web legs clobber each other and tank the hit rate.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # Boot the freshly built api image against a throwaway Postgres and hit
  # /health. The build job above only *builds* the image; it never runs it, so a
  # crash on boot — e.g. an ESM/JSON import that fails only under plain Node in
  # the compiled image, not under tsx/vitest — sails through every other check
  # and first surfaces in production. This is the cheap guard for that class.
  # API only: it has the DB + migrate-on-boot path where boot failures live; the
  # web image is a static Node server, lower risk.
  smoke:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reuses the api build cache the matrix job just populated, so this is
      # cache hits + a local load rather than a fresh compile.
      - name: Build api image (load into local daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: thalermark-api:smoke
          platforms: linux/amd64
          cache-from: type=gha,scope=api

      - name: Boot api against Postgres and check /health
        run: |
          docker network create smoke

          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=thalermark \
            -e POSTGRES_PASSWORD=thalermark \
            -e POSTGRES_DB=thalermark \
            pgvector/pgvector:pg17

          echo "waiting for postgres..."
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U thalermark -q && break
            sleep 2
          done
          sleep 2

          docker run -d --name api --network smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://thalermark:thalermark@pg:5432/thalermark \
            -e APP_DATABASE_URL=postgres://thalermark_app:thalermark_app@pg:5432/thalermark \
            -e THALERMARK_APP_PASSWORD=thalermark_app \
            -e PGBOSS_DATABASE_URL=postgres://thalermark_pgboss:thalermark_pgboss@pg:5432/thalermark \
            -e THALERMARK_PGBOSS_PASSWORD=thalermark_pgboss \
            -e MIGRATE_ON_BOOT=true \
            -e BETTER_AUTH_SECRET=ci-smoke-not-a-real-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e STORAGE_DRIVER=local \
            -e STORAGE_LOCAL_PATH=/app/data/storage \
            thalermark-api:smoke

          echo "waiting for api /health..."
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "${healthy:-}" != "1" ]; then
            echo "::error::api did not pass /health within timeout — boot likely failed"
            echo "----- api logs -----"
            docker logs api || true
            exit 1
          fi
          echo "api booted and /health is green"
