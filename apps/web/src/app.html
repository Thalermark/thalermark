<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1626" />
    <script nonce="%sveltekit.nonce%">
      // Apply the theme before first paint to avoid a flash. Persisted choice
      // ('dark' | 'light') wins; otherwise follow the OS preference. Mirrors the
      // logic in ThemeToggle.svelte; keep the two in sync.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0f1626' : '#f4ede0');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Thalermark</title>
    <link rel="stylesheet" href="/brand-fonts.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-surface font-sans text-fg antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
