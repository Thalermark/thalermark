# Thalermark — local dev compose
# Just the backing services. Apps run on the host via `pnpm dev`.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: thalermark
      POSTGRES_PASSWORD: thalermark
      POSTGRES_DB: thalermark
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thalermark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for dev (receipts, attachments).
  # Web console at http://localhost:9001 (login: thalermark / thalermark-dev).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thalermark
      MINIO_ROOT_PASSWORD: thalermark-dev
    volumes:
      - minio_dev_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  minio_dev_data:
