# Thalermark — self-host compose
#
# Goal: a single `docker compose up` brings up the full stack.
#   - postgres (with pgvector)
#   - api      (Hono, migrations on boot)
#   - web      (SvelteKit adapter-node)
#   - caddy    (TLS-terminating reverse proxy, same-origin routing)
#
# All secrets + tunables live in the project-root .env file (see .env.example).
# Self-host-specific overrides (DATABASE_URL host, BETTER_AUTH_URL scheme,
# MIGRATE_ON_BOOT, internal vs public URL split) are set inline below so
# operators don't have to maintain a parallel set of values per deploy mode.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thalermark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thalermark}
      POSTGRES_DB: ${POSTGRES_DB:-thalermark}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres stays off the host network in self-host. Operators needing
    # admin access can `docker compose exec postgres psql -U $POSTGRES_USER`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thalermark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      # DATABASE_URL is the superuser handle — used for migrations and for
      # the boot-time ALTER ROLE that promotes thalermark_app to LOGIN.
      # APP_DATABASE_URL is the runtime handle and points at the non-
      # BYPASSRLS app role so RLS policies actually fire. Inside the compose
      # network postgres is reachable at its service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-thalermark}:${POSTGRES_PASSWORD:-thalermark}@postgres:5432/${POSTGRES_DB:-thalermark}
      APP_DATABASE_URL: postgres://thalermark_app:${THALERMARK_APP_PASSWORD:-thalermark_app}@postgres:5432/${POSTGRES_DB:-thalermark}
      THALERMARK_APP_PASSWORD: ${THALERMARK_APP_PASSWORD:-thalermark_app}
      MIGRATE_ON_BOOT: "true"
      # External URL for cookies/redirects/invite links. BA uses this as its
      # canonical baseURL; Caddy terminates TLS so requests reach api over
      # plain HTTP, but BA still generates HTTPS-flavoured cookies because
      # this value says so.
      BETTER_AUTH_URL: "https://${THALERMARK_DOMAIN:-localhost}"
      PUBLIC_APP_URL: "https://${THALERMARK_DOMAIN:-localhost}"
      # CSRF allowlist — browser origin + mobile scheme.
      TRUSTED_ORIGINS: "https://${THALERMARK_DOMAIN:-localhost},thalermark://"
      # Receipt storage. Self-host uses the local-FS driver: receipts are written
      # to the storage_data volume below and served back through the signed
      # /api/files/<token> route. These two override whatever the root .env sets
      # (it ships the dev MinIO config). Set STORAGE_URL_SECRET in .env (a long
      # random value — it signs those tokens) to enable receipt capture; without
      # it the stack still comes up, receipt upload just returns 503. For
      # multi-node or large deployments, point at an S3-compatible store (R2,
      # MinIO) instead — see the deployment docs' "Storage options".
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/data/storage
    volumes:
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Empty PUBLIC_API_URL makes the browser issue same-origin /api/* calls
      # through Caddy. Server-side SSR (hooks.server.ts) reads
      # INTERNAL_API_URL instead — Node fetch needs an absolute URL and
      # cannot reach `api` via the public hostname from inside the network.
      PUBLIC_API_URL: ""
      INTERNAL_API_URL: "http://api:3000"
      # Address autocomplete: the web app serves the browser proxy
      # (/locations/autocomplete) and the api serves /api/locations/autocomplete
      # for the mobile client, so the provider config must reach BOTH. The api
      # picks it up from the root .env via env_file above; the web service has
      # no env_file, so it's passed explicitly here. Unset => the free, keyless
      # US Census geocoder. Set MAPBOX_ACCESS_TOKEN to upgrade, or
      # LOCATION_PROVIDER=nominatim (+ NOMINATIM_BASE_URL) for OSS/international.
      LOCATION_PROVIDER: ${LOCATION_PROVIDER:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      THALERMARK_DOMAIN: ${THALERMARK_DOMAIN:-localhost}
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
